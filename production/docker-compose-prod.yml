services:
  #postgresql
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kapruka
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kapruka"]
      interval: 5s
      timeout: 5s
      retries: 5

  #qdrant
  qdrant:
    image: qdrant/qdrant:v1.18.1
    restart: unless-stopped
    expose:
      - "6334"
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  #backend
  backend:
    image: 954020871099.dkr.ecr.ap-southeast-1.amazonaws.com/kapruka-gift-concierge/backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    volumes:
      - semantic_memory:/app/data/semantic_memory
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  #frontend
  frontend:
    image: 954020871099.dkr.ecr.ap-southeast-1.amazonaws.com/kapruka-gift-concierge/frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  semantic_memory:
